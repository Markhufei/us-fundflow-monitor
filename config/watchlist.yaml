# 美股资金流动监控 - 标的与阈值配置
# 更新: 2026-07-21

# SEC EDGAR 要求的 User-Agent（占位邮箱，EDGAR 政策要求标识身份，可改为真实邮箱）
sec_user_agent: "huangshifei@example.com"

# 请求间隔（秒），避免限流
request_delay: 1.0

# ===== 监控标的 =====
watchlist:
  stocks:
    - symbol: MU
      name: 美光科技
      exchange: NASDAQ
      category: stock
    - symbol: SNDK
      name: 闪迪 SanDisk
      exchange: NASDAQ
      category: stock
      note: "2025-02 从 WDC 分拆上市，历史数据不足 1 年，均量计算需降级"
    # SKHXY (OTC 存托凭证) 已于 2026-09-01 移除: Twelve Data 免费版不支持 OTC，从未成功采集（DB 0 行）。
    # SK 海力士监控由 sector_stocks 的 SKHY（纳斯达克 ADR）覆盖。

  etfs:
    - symbol: SOXX
      name: iShares 半导体 ETF
      track: 费城半导体指数 SOX
      category: etf
    - symbol: SMH
      name: VanEck 半导体 ETF
      track: MVIS 半导体指数
      category: etf

# ===== 异动判定阈值 =====
thresholds:
  volume_spike_ratio: 1.8       # 日量 / 20日均量 > 此值 -> 异常
  price_move_pct: 0.05          # 日涨跌幅 > 此值 -> 异常
  cmf_reversal_abs: 0.3         # |CMF| > 此值 或 正负反转 -> 异常
  inst_reduce_pct: 0.10         # 13F 前十大机构减持 > 此比例 -> 异常
  insider_sell_usd: 1000000     # Form 4 内部人净卖出 > 此值 -> 异常
  short_ratio_high: 0.40        # FINRA 短量占比 > 此值
  short_ratio_delta: 0.10       # 短量占比环比上升 > 此值 -> 异常

# ===== 计算周期 =====
periods:
  vol_avg_days: 20              # 成交量均线周期
  cmf_period: 20                # Chaikin Money Flow 周期
  mfi_period: 14                # Money Flow Index 周期
  compare_short_days: 2         # 2日对比窗口
  compare_week_days: 5          # 周对比窗口（5个交易日）

# ===== 通知设置 =====
alerts:
  min_severity: "MEDIUM"        # MEDIUM 及以上才发 macOS 通知
  log_file: "logs/fundflow.log"
  report_dir: "reports"

# ===== 版块轮动监控（SPDR Sector ETF）=====
sector_etfs:
  benchmark: SPY
  etfs:
    - { symbol: XLK,  sector: 科技 }
    - { symbol: XLE,  sector: 能源 }
    - { symbol: XLF,  sector: 金融 }
    - { symbol: XLV,  sector: 医疗 }
    - { symbol: XLY,  sector: 可选消费 }
    - { symbol: XLP,  sector: 必需消费 }
    - { symbol: XLI,  sector: 工业 }
    - { symbol: XLB,  sector: 材料 }
    - { symbol: XLRE, sector: 房地产 }
    - { symbol: XLU,  sector: 公用事业 }
    - { symbol: XLC,  sector: 通信 }
    - { symbol: UFO,  sector: 太空 }   # 2026-08-17 新增: Procure Space ETF，纯太空/卫星概念（非 SPDR，2019 年成立，历史事件样本少）

# 版块轮动判定阈值
sector_thresholds:
  rs_momentum_cross: 0.0        # RS-Momentum 上穿此值 -> 转强候选（sector_detector 读此值）
  rs_ratio_cross: 100.0         # RS-Ratio 上穿此值 -> 强势确认（sector_detector 读此值）
  vol_confirm_zscore: 1.5       # 量能确认（当日 vol_zscore > 此值）
  momentum_confirm_days: 2      # 去抖: RS-Mom 同向连续 N 天才算确认交叉（08-31 回测定参）
  momentum_tol_abs: 0.5         # 概率匹配绝对容差 ±0.5（类型过滤后匹配样本中位 23）
  prob_min_sample: 10           # 概率查询最小样本（低于此值标"低置信度"）
  prob_high_sample: 30          # 高置信度样本阈值
  sustained_amplitude: 0.02     # "持续"定义：事件后 20 交易日超额收益 >= 2%（基准率 22.8%；
                                #   旧定义 dur>=10 且 ret10>=3% 基准率仅 4.8%，概率锁死低区间，已废）
# 注: vol_high_zscore 已删除（全项目零引用；量能异常告警由 anomaly_detector 硬编码 2.0/1.5）

# ===== 个股轮动监控（RS vs SPY，与版块同基准；2026-08-11 新增）=====
# 注意: SKHY 是 2026 年纳斯达克新上市的海力士 ADR（非老 watchlist 里的 OTC 凭证 SKHXY）
sector_stocks:
  - { symbol: SKHY, name: "SK海力士 ADR", sector_symbol: XLK }
  - { symbol: MU,   name: "美光科技",     sector_symbol: XLK }
  - { symbol: SNDK, name: "闪迪 SanDisk", sector_symbol: XLK }
  - { symbol: AAPL, name: "苹果 Apple",   sector_symbol: XLK }
  - { symbol: SPCX, name: "SpaceX",      sector_symbol: UFO }   # 2026-08-17 新增: 用户提供代码，待采集验证（外部源未能确认）
  # 2026-08-29 新增: 美股七姐妹（AAPL 原已在列）
  - { symbol: MSFT,  name: "微软 Microsoft",  sector_symbol: XLK }
  - { symbol: NVDA,  name: "英伟达 NVIDIA",   sector_symbol: XLK }
  - { symbol: GOOGL, name: "谷歌 Alphabet",   sector_symbol: XLC }
  - { symbol: META,  name: "Meta 平台",       sector_symbol: XLC }
  - { symbol: AMZN,  name: "亚马逊 Amazon",   sector_symbol: XLY }
  - { symbol: TSLA,  name: "特斯拉 Tesla",    sector_symbol: XLY }

# 版块计算周期
# 2026-08-31 回测定参（2025-10-01~2026-08-31, 扣 0.1%/笔, 5 对含 XLK/XLE/XLF vs SPY）:
#   P10 切换 37-55 次/年且 4/5 对净收益最差（whipsaw）；P30+去抖2天 切换 9-17 次、
#   版块对平均净收益最优。建库脚本与 detect_rotation 共读本配置，改这里两边同步生效。
sector_periods:
  rs_ratio_period: 30           # RS-Ratio 归一化窗口（日线）
  rs_momentum_period: 30        # RS-Momentum ROC 周期（与归一化窗口同值，JdK 惯例）
  sector_hist_days: 120         # 日常采集历史天数（需 >= 2×period + 去抖余量）
  backtest_years: 25            # 事件库回测年数（2000-2026）

# ===== 指数观察模块（GSPC/IXIC/DJI + 代理/杠杆 ETF；2026-10-18 新增）=====
# 数据源: 指数本体走 yfinance ^ 前缀（Twelve Data 免费档不支持指数，
#   2026-10-16 实测 IXIC/DJI/GSPC 404）；代理/杠杆 ETF 走现有 Twelve Data collector。
# 双轨框架: GSPC 对 SPY 的 RS 无意义（SPY 即其代理）-> 纯回撤框架（rs 字段 NULL）；
#   IXIC/DJI 复用 sector_rotation RS 公式（vs SPY）。
# 资金流指标走代理 ETF（指数本体育量为空/失真）: GSPC->SPY、IXIC->QQQ、DJI->DIA。
# 杠杆 ETF 按 90 日均量实测选择（2026-06-10 ~ 2026-10-16，证据见 logs/index_etf_selection.log）:
#   GSPC: SSO 3.19M(胜 SPXL 1.69M) / SPXU 8.21M(胜 SDS 3.00M)
#   DJI:  UDOW 1.73M(胜 DDM 0.19M) / SDOW 3.90M(胜 DXD 1.89M)
#   IXIC: TQQQ/SQQQ 用户指定——注意跟踪 NDX（100 支大盘股）而非 IXIC 综合指数，口径差异见面板标注
index_watch:
  - symbol: GSPC
    name: 标普500
    flow_proxy: SPY
    leveraged_long: SSO
    leveraged_short: SPXU
    rs_framework: false         # 纯回撤框架
  - symbol: IXIC
    name: 纳斯达克综合
    flow_proxy: QQQ
    leveraged_long: TQQQ
    leveraged_short: SQQQ       # 跟踪 NDX，非 IXIC 综合指数
    rs_framework: true
  - symbol: DJI
    name: 道琼斯工业
    flow_proxy: DIA
    leveraged_long: UDOW
    leveraged_short: SDOW
    rs_framework: true

# 指数触发阈值（5 类规则共用，identify_index_events / detect / 建库脚本共读本节）
index_thresholds:
  pullback_dd: -0.05            # dd20 <= -5% 视为回调（pullback_start / 活跃回调段）
  confirm_days: 2               # 去抖确认天数（新鲜交叉）
  pullback_lookback: 15         # 活跃回调段回看天数（dd20.rolling(15).min() <= pullback_dd）
  vol_confirm: 1.5              # 量能确认（vol_zscore >= 此值）
  cmf_withdrawal: -0.10         # 资金撤出（cmf 连续 confirm_days 天 < 此值）
  rebound_min_ret: 0.015        # 抄底信号单日涨幅下限
  momentum_tol_abs: 0.5         # sustained_uptrend 概率匹配 RS-Momentum 绝对容差
  prob_min_sample: 10           # 概率查询最小样本（低于标"低置信度"）
  prob_high_sample: 30          # 高置信度样本阈值
  sustained_amplitude: 0.02     # 延续/反弹成立定义: ret_20d 绝对收益 >= 2%

# 指数计算周期
index_periods:
  rs_ratio_period: 30           # RS-Ratio 归一化窗口（与版块同参）
  rs_momentum_period: 30        # RS-Momentum ROC 周期
  index_hist_days: 250          # 日常采集/检测历史天数（需覆盖 MA200）
  backtest_years: 25            # 事件库回测年数
# 数据源补充（2026-10-18）: 指数本体主源=腾讯财经 kline（真指数 OHLCV，中国直连无 key，
#   GSPC->usINX / IXIC->usIXIC / DJI->usDJI；单次 <=800 根分段翻页，历史深度约 2008->今），
#   备源=yfinance ^ 前缀（Yahoo 对本机 IP 持续 429/403 封禁期间不可用）。
#   实时信号 data_source 列记录实际来源（tencent/yfinance/twelvedata）。
